[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vuln-intelligence-api"
version = "0.1.0"
description = "Offline-first vulnerability ingestion, enrichment, and explainable prioritization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "bandit>=1.8,<2"]

[project.scripts]
vuln-intel = "vuln_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vuln_intelligence"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vuln_intelligence --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.coverage.run]
source = ["vuln_intelligence"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
