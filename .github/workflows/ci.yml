name: Quality and security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      VULN_ENABLE_LIVE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.1
          uv sync --frozen --extra dev
      - name: Ruff
        run: |
          uv run --frozen ruff check src tests
          uv run --frozen ruff format --check src tests
      - name: Bandit
        run: uv run --frozen bandit -r src -q
      - name: Offline tests and coverage
        run: uv run --frozen pytest
      - name: Preserve coverage result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn
